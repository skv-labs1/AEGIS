[project]
name = "aegis-demo-systems"
version = "0.1.0"
description = "Synthetic enterprise systems (ITSM, ITAM, Endpoint) exposed as MCP servers for the Aegis demo"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
aegis-demo-seed = "aegis_demo.common.seed:main"
aegis-demo-itsm = "aegis_demo.itsm.server:main"
aegis-demo-itam = "aegis_demo.itam.server:main"
aegis-demo-endpoint = "aegis_demo.endpoint.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis_demo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
